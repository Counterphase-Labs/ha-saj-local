x-mock: &mock
  image: saj-local-mock
  pull_policy: never
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >-
        import socket;
        connection = socket.create_connection(('127.0.0.1', 502), timeout=2);
        connection.close()
    interval: 2s
    timeout: 3s
    retries: 20
    start_period: 5s

x-runner-user: &runner-user
  user: "${PLAYWRIGHT_RESULT_UID:-1000}:${PLAYWRIGHT_RESULT_GID:-1000}"
  tmpfs:
    - /home/playwright:mode=1777
  environment: &runner-environment
    HOME: /home/playwright
    HOME_ASSISTANT_URL: http://homeassistant:8123

services:
  homeassistant:
    image: ${PLAYWRIGHT_HOME_ASSISTANT_IMAGE:-saj-local-playwright-home-assistant}
    build:
      context: .
      dockerfile: Dockerfile.playwright-home-assistant
    environment:
      TZ: UTC
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5)
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    volumes:
      - homeassistant-config:/config

  mock:
    <<: *mock
    volumes:
      - ./mock/scenarios/hs3-battery.yaml:/config/config.yaml:ro

  mock-h2:
    <<: *mock
    volumes:
      - ./mock/scenarios/h2-battery.yaml:/config/config.yaml:ro

  mock-docs:
    <<: *mock
    volumes:
      - ./mock/scenarios/hs3-full-house.yaml:/config/config.yaml:ro

  playwright:
    <<: *runner-user
    image: ${PLAYWRIGHT_RUNNER_IMAGE:-saj-local-playwright-runner}
    build:
      context: .
      dockerfile: Dockerfile.playwright-runner
    depends_on:
      homeassistant:
        condition: service_healthy
      mock:
        condition: service_healthy
      mock-h2:
        condition: service_healthy
    init: true
    ipc: host
    volumes:
      - ./frontend/playwright-report:/workspace/frontend/playwright-report
      - ./frontend/test-results:/workspace/frontend/test-results

  playwright-docs:
    <<: *runner-user
    image: ${PLAYWRIGHT_RUNNER_IMAGE:-saj-local-playwright-runner}
    build:
      context: .
      dockerfile: Dockerfile.playwright-runner
    depends_on:
      homeassistant:
        condition: service_healthy
      mock-docs:
        condition: service_healthy
      mock-h2:
        condition: service_healthy
    command:
      - npm
      - run
      - test:docs
    environment:
      <<: *runner-environment
      DOCS_LOCALE: ${DOCS_LOCALE:-en-GB}
    init: true
    ipc: host
    volumes:
      - ./docs/images:/workspace/docs/images
      - ./frontend/playwright-report:/workspace/frontend/playwright-report
      - ./frontend/test-results:/workspace/frontend/test-results

volumes:
  homeassistant-config:
