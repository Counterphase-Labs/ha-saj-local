<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAJ simulator</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --text: #1c2430;
  --muted: #5d6b7d;
  --line: #d5dbe3;
  --accent: #1b6ec2;
  --danger: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141a22;
    --panel: #1c2430;
    --text: #e6ebf2;
    --muted: #93a1b3;
    --line: #34404f;
    --accent: #5aa5ee;
    --danger: #ff8a80;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 1; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { margin: 0 0 4px; font-size: 16px; }
.readings { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); }
.readings b { color: var(--text); font-weight: 600; }
main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 48px; }
section { margin: 12px 0; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
section > h2 { margin: 0 0 8px; font-size: 15px; }
details { margin: 4px 0; }
summary { cursor: pointer; font-weight: 600; padding: 2px 0; }
.row { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(160px, 2fr) auto; gap: 4px 12px; align-items: center; padding: 3px 0; border-top: 1px solid var(--line); }
.row .name { overflow-wrap: anywhere; }
.row small { color: var(--muted); display: block; }
.value { color: var(--muted); }
.error { color: var(--danger); }
.bits { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px 12px; }
.bits label { display: flex; gap: 6px; align-items: baseline; }
.reserved { color: var(--muted); }
.buttons { display: flex; flex-wrap: wrap; gap: 8px; }
input, select, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
input[type=range] { width: 100%; padding: 0; }
input[type=checkbox] { padding: 0; }
button, a.button { cursor: pointer; background: var(--accent); color: #fff; border-color: var(--accent); text-decoration: none; padding: 4px 10px; border-radius: 4px; }
button.plain { background: var(--bg); color: var(--text); border-color: var(--line); }
.offline { color: var(--danger); }
@media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1 id="title">SAJ simulator</h1>
  <div class="readings" id="readings"></div>
</header>
<main id="main"></main>
<script>
"use strict";

const POLL_MS = 3000;
// One entry per control: how to show the device's current value in it.
const refreshers = [];
let description = null;
const readingsElement = document.getElementById("readings");

function el(tag, attributes, ...children) {
  const element = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes || {})) {
    if (name === "text") element.textContent = value;
    else element.setAttribute(name, value);
  }
  element.append(...children);
  return element;
}

function hasFocus(element) {
  return element === document.activeElement || element.contains(document.activeElement);
}

async function request(path, method, body) {
  const options = { method };
  if (body !== undefined) {
    options.headers = { "Content-Type": "application/json" };
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  return { ok: response.ok, data: await response.json() };
}

async function send(path, body, errorElement) {
  try {
    const result = await request(path, "POST", body);
    errorElement.textContent = result.ok ? "" : result.data.error;
    if (result.ok) applyState(result.data);
  } catch (error) {
    errorElement.textContent = "request failed: " + error.message;
  }
}

function section(title, ...children) {
  return el("section", {}, el("h2", { text: title }), ...children);
}

function group(title, ...children) {
  return el("details", {}, el("summary", { text: title }), ...children);
}

function whenIdle(element, update) {
  refreshers.push((state) => { if (!hasFocus(element)) update(state); });
}

function optionLabel(option) {
  return option.label === null ? String(option.value) : option.value + " " + option.label;
}

function settingControl(setting, error) {
  let input;
  if (setting.options) {
    input = el("select", { "aria-label": setting.name });
    for (const option of setting.options) {
      input.append(el("option", { value: option.value, text: optionLabel(option) }));
    }
  } else if (setting.text) {
    input = el("input", { type: "text", maxlength: setting.max_length, "aria-label": setting.name });
  } else {
    input = el("input", { type: "number", step: 1, min: setting.minimum, max: setting.maximum, "aria-label": setting.name });
  }
  const scaled = el("span", { class: "value" });
  input.addEventListener("change", () => {
    const value = setting.text ? input.value : Number(input.value);
    send("/api/settings", { [setting.name]: value }, error);
  });
  whenIdle(input, (state) => {
    const current = state.settings[setting.name];
    if (!current) return;
    input.value = current.raw;
    scaled.textContent = setting.scale === 1 ? "" : "= " + current.value;
  });
  return [input, scaled];
}

function settingsSection() {
  const groups = new Map();
  for (const setting of description.settings) {
    if (!groups.has(setting.group)) groups.set(setting.group, []);
    const error = el("span", { class: "error" });
    const [input, scaled] = settingControl(setting, error);
    groups.get(setting.group).push(el("div", { class: "row" },
      el("div", { class: "name" }, setting.name, el("small", { text: setting.address })),
      el("div", {}, input, " ", scaled),
      error));
  }
  const parts = [...groups].map(([title, rows]) => group(title + " (" + rows.length + ")", ...rows));
  return section("Settings", ...parts);
}

function commandRow(command) {
  const error = el("span", { class: "error" });
  let input;
  if (command.options) {
    input = el("select", { "aria-label": command.name });
    for (const option of command.options) {
      input.append(el("option", { value: option.value, text: optionLabel(option) }));
    }
  } else {
    input = el("input", { type: "number", step: 1, value: 1, "aria-label": command.name });
  }
  const run = el("button", { text: "Run" });
  run.addEventListener("click", () => send("/api/commands", { name: command.name, value: Number(input.value) }, error));
  return el("div", { class: "row" },
    el("div", { class: "name" }, command.name, el("small", { text: command.address })),
    el("div", {}, input, " ", run),
    error);
}

function commandsSection() {
  return section("Commands", ...description.commands.map(commandRow));
}

function title(text) {
  return text.replace(/_/g, " ").replace(/^./, (letter) => letter.toUpperCase());
}

function bitCheckbox(equipment, bit, error) {
  const box = el("input", { type: "checkbox" });
  box.addEventListener("change", () => send("/api/faults", { [equipment]: { [bit.key]: box.checked } }, error));
  refreshers.push((state) => { box.checked = Boolean(state.faults[equipment][bit.key]); });
  const name = bit.reserved ? bit.name : bit.bit + " " + bit.name;
  return el("label", bit.reserved ? { class: "reserved" } : {}, box, name);
}

function equipmentFaults(equipment, bits, error) {
  const registers = new Map();
  for (const bit of bits) {
    if (!registers.has(bit.register)) registers.set(bit.register, []);
    registers.get(bit.register).push(bitCheckbox(equipment, bit, error));
  }
  const parts = [...registers].map(([register, boxes]) => group(register, el("div", { class: "bits" }, ...boxes)));
  return group(title(equipment), ...parts);
}

function packRow(pack, error) {
  const fault = el("input", { type: "number", min: 0, max: 65535, step: 1, value: 0, "aria-label": "pack " + pack + " fault" });
  const warning = el("input", { type: "number", min: 0, max: 65535, step: 1, value: 0, "aria-label": "pack " + pack + " warning" });
  const apply = () => send("/api/faults", { packs: { [pack]: { fault: Number(fault.value), warning: Number(warning.value) } } }, error);
  fault.addEventListener("change", apply);
  warning.addEventListener("change", apply);
  const row = el("div", { class: "row" },
    el("div", { class: "name", text: "Pack " + pack + " codes" }),
    el("div", {}, "fault ", fault, " warning ", warning),
    error);
  whenIdle(row, (state) => {
    const codes = state.faults.packs[pack] || { fault: 0, warning: 0 };
    fault.value = codes.fault;
    warning.value = codes.warning;
  });
  return row;
}

function faultsSection() {
  const faults = description.faults;
  const error = el("div", { class: "error" });
  const clear = el("button", { text: "Clear all faults" });
  clear.addEventListener("click", () => send("/api/commands", { name: faults.clear_all.command, value: faults.clear_all.value }, error));
  const parts = Object.keys(faults)
    .filter((key) => Array.isArray(faults[key]) && faults[key].length && typeof faults[key][0] === "object")
    .map((key) => equipmentFaults(key, faults[key], error));
  const packs = faults.packs.map((pack) => packRow(pack, el("span", { class: "error" })));
  return section("Faults", el("div", { class: "buttons" }, clear), error, ...parts, ...packs);
}

function variationRow(parameter) {
  const error = el("span", { class: "error" });
  const attributes = { min: parameter.minimum, max: parameter.maximum, step: parameter.step };
  const field = el("input", { ...attributes, type: "number", "aria-label": parameter.label });
  const slider = parameter.slider ? el("input", { ...attributes, type: "range", "aria-label": parameter.label + " slider" }) : null;
  const sendValue = (input) => send("/api/variation", { [parameter.name]: Number(input.value) }, error);
  field.addEventListener("change", () => sendValue(field));
  if (slider) {
    slider.addEventListener("input", () => { field.value = slider.value; });
    slider.addEventListener("change", () => sendValue(slider));
    field.addEventListener("input", () => { slider.value = field.value; });
  }
  const controls = el("div", {}, ...(slider ? [slider, " "] : []), field, " " + parameter.unit);
  whenIdle(controls, (state) => {
    field.value = state.variation[parameter.name];
    if (slider) slider.value = field.value;
  });
  return el("div", { class: "row" },
    el("div", { class: "name" }, parameter.label, el("small", { text: "scenario value " + parameter.default + " " + parameter.unit })),
    controls,
    error);
}

function variationSection() {
  const groups = new Map();
  for (const parameter of description.variation) {
    if (!groups.has(parameter.group)) groups.set(parameter.group, []);
    groups.get(parameter.group).push(variationRow(parameter));
  }
  return section("Variation", ...[...groups].map(([name, rows]) => group(name, ...rows)));
}

function holdRow(hold) {
  const error = el("span", { class: "error" });
  const enabled = el("input", { type: "checkbox", "aria-label": "hold " + hold.label });
  const input = el("input", { type: "number", min: hold.minimum, max: hold.maximum, step: hold.step });
  const apply = () => send("/api/holds", { [hold.name]: enabled.checked ? Number(input.value) : null }, error);
  enabled.addEventListener("change", apply);
  input.addEventListener("change", () => { if (enabled.checked) apply(); });
  const row = el("div", { class: "row" },
    el("div", { class: "name", text: hold.label }),
    el("div", {}, enabled, " hold at ", input, " " + hold.unit),
    error);
  whenIdle(row, (state) => {
    const held = state.holds[hold.name];
    enabled.checked = held !== null;
    input.value = held !== null ? held : state.hold_readings[hold.name];
  });
  return row;
}

function holdsSection() {
  return section("Holds", ...description.holds.map(holdRow));
}

function batterySection() {
  const battery = description.model.equipment.battery;
  const error = el("span", { class: "error" });
  const slider = el("input", { type: "range", min: battery.soc_bounds[0], max: battery.soc_bounds[1], step: 1, "aria-label": "state of charge" });
  const shown = el("output", { class: "value" });
  const show = () => { shown.textContent = slider.value + " %"; };
  slider.addEventListener("input", show);
  slider.addEventListener("change", () => send("/api/battery", { soc_percent: Number(slider.value) }, error));
  whenIdle(slider, (state) => { slider.value = Math.round(state.battery.soc_percent); show(); });
  return section("Battery", el("div", { class: "row" },
    el("div", { class: "name", text: "State of charge" }), slider, el("div", {}, shown, " ", error)));
}

function evSection() {
  const charger = description.model.equipment.ev_charger;
  const error = el("span", { class: "error" });
  const energy = el("input", { type: "number", min: charger.energy_bounds_wh[0], max: charger.energy_bounds_wh[1], step: 100, value: charger.default_energy_wh });
  const status = el("span", { class: "value" });
  const plugIn = el("button", { text: "Plug in" });
  const unplug = el("button", { class: "plain", text: "Unplug" });
  plugIn.addEventListener("click", () => send("/api/ev", { plugged: true, energy_needed_wh: Number(energy.value) }, error));
  unplug.addEventListener("click", () => send("/api/ev", { plugged: false }, error));
  refreshers.push((state) => { status.textContent = state.ev_charger.plugged ? "car plugged in" : "no car"; });
  return section("EV charger", el("div", { class: "row" },
    el("div", { class: "name", text: "Car" }),
    el("div", {}, "needs ", energy, " Wh ", plugIn, " ", unplug),
    el("div", {}, status, " ", error)));
}

function clockSection() {
  const error = el("div", { class: "error" });
  const time = el("input", { type: "datetime-local", step: 1, "aria-label": "simulated time" });
  const setTime = el("button", { text: "Set time" });
  setTime.addEventListener("click", () => send("/api/clock", { time: time.value }, error));
  const bounds = description.model.clock.speed_bounds;
  const speed = el("input", { type: "number", min: bounds[0], max: bounds[1], step: "any", "aria-label": "simulated seconds per second" });
  const setSpeed = el("button", { text: "Set speed" });
  setSpeed.addEventListener("click", () => send("/api/clock", { speed: Number(speed.value) }, error));
  whenIdle(time, (state) => { time.value = state.time; });
  whenIdle(speed, (state) => { speed.value = state.speed; });
  return section("Clock", el("div", { class: "row" },
    el("div", { class: "name", text: "Simulated time (UTC)" }), el("div", {}, time, " ", setTime), el("span")),
    el("div", { class: "row" },
    el("div", { class: "name", text: "Speed (simulated seconds per second)" }), el("div", {}, speed, " ", setSpeed), el("span")),
    error);
}

function presetsSection() {
  const error = el("div", { class: "error" });
  const buttons = description.presets.map((preset) => {
    const button = el("button", { class: "plain", title: preset.description, text: preset.name });
    button.addEventListener("click", () => send("/api/presets/" + encodeURIComponent(preset.key), undefined, error));
    return button;
  });
  return section("Presets", el("p", { class: "value", text: "A preset returns settings, variation, faults and holds to the scenario, then applies its changes. Time, energy counters and battery charge carry on." }), el("div", { class: "buttons" }, ...buttons), error);
}

function resetSection() {
  const error = el("div", { class: "error" });
  const reset = el("button", { text: "Reset to scenario" });
  reset.addEventListener("click", () => send("/api/reset", undefined, error));
  const ledger = el("button", { class: "plain", text: "Reset energy counters" });
  ledger.addEventListener("click", () => send("/api/ledger/reset", undefined, error));
  const exported = el("a", { class: "button", href: "/api/scenario", download: "scenario.yaml", text: "Export scenario" });
  return section("Reset and export", el("div", { class: "buttons" }, reset, ledger, exported), error);
}

function applyState(state) {
  readingsElement.replaceChildren(
    el("span", {}, "time ", el("b", { text: state.time })),
    ...state.readings.map((reading) => el("span", {}, reading.label + " ", el("b", { text: reading.value + " " + reading.unit }))));
  for (const refresh of refreshers) refresh(state);
}

async function poll() {
  try {
    const result = await request("/api/state", "GET");
    readingsElement.classList.remove("offline");
    applyState(result.data);
  } catch (error) {
    readingsElement.classList.add("offline");
    readingsElement.textContent = "simulator not answering";
  }
}

async function start() {
  description = (await request("/api/description", "GET")).data;
  const model = description.model;
  document.getElementById("title").textContent =
    model.name.toUpperCase() + " " + model.rated_power_w + " W, " + model.serial_number;
  const equipment = model.equipment;
  const sections = [presetsSection(), settingsSection(), commandsSection(), faultsSection(), variationSection(), holdsSection()];
  if (equipment.battery.fitted) sections.push(batterySection());
  if (equipment.ev_charger.fitted) sections.push(evSection());
  sections.push(clockSection(), resetSection());
  document.getElementById("main").append(...sections);
  await poll();
  setInterval(poll, POLL_MS);
}

start().catch((error) => { document.getElementById("main").textContent = "Could not load the description: " + error.message; });
</script>
</body>
</html>
