name: ha-saj-local

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.3
    ports:
      - "8123:8123"
    environment:
      TZ: UTC
      PYTHONPYCACHEPREFIX: /tmp/saj_local_pycache
    volumes:
      - ./config:/config
      - ./custom_components/saj_local:/config/custom_components/saj_local:ro
    tmpfs:
      - /config/custom_components/saj_local/__pycache__
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  mock:
    build:
      context: ./mock
    volumes:
      - ./mock/scenarios/hs3-battery.yaml:/config/config.yaml:ro
      - ${SAJ_MOCK_STATE_DIR:-./mock/state}/hs3:/data
    ports:
      - "${SAJ_MOCK_HOST_PORT:-5020}:502"
      - "${SAJ_MOCK_PANEL_HOST_PORT:-5080}:8080"
    restart: unless-stopped

  mock-h2:
    build:
      context: ./mock
    volumes:
      - ./mock/scenarios/h2-battery.yaml:/config/config.yaml:ro
      - ${SAJ_MOCK_STATE_DIR:-./mock/state}/h2:/data
    ports:
      - "${SAJ_MOCK_H2_HOST_PORT:-5021}:502"
      - "${SAJ_MOCK_H2_PANEL_HOST_PORT:-5081}:8080"
    restart: unless-stopped
