name: Release

on:
  push:
    tags: ["[0-9]*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Tell a beta from a stable release
        id: kind
        run: |
          if [[ "$GITHUB_REF_NAME" == *b* ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml

  release:
    needs: [tag, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --draft --verify-tag --generate-notes
          --title "$GITHUB_REF_NAME" $PRERELEASE
