name: Bug report
description: Something in the SAJ Local integration does not work as it should
labels: ["🛠 goal: fix", "🚦 status: awaiting triage", "🔌 part: integration"]
body:
  - type: markdown
    attributes:
      value: |
        Before you open a new issue, [search the existing bug reports](../../issues?q=is%3Aissue+label%3A%22%F0%9F%9B%A0+goal%3A+fix%22+) to see if others have had the same problem.

        A problem with a dashboard card has its own form. A security problem goes through the [security policy](https://github.com/Counterphase-Labs/ha-saj-local/blob/main/SECURITY.md), never an issue.
  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - HS3
        - H2
        - Other
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: How SAJ Local reaches the inverter
      options:
        - The inverter's own network port
        - SAJ communication module (such as the AIO3)
        - RS485 to Modbus TCP gateway
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear and concise description of what the issue is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Without steps to reproduce, it will be hard to fix. Issues without them will be closed.
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics download
      description: 'Drag the file [downloaded from the system''s menu](https://github.com/Counterphase-Labs/ha-saj-local/blob/main/docs/en-gb/user/troubleshooting.md#download-diagnostics) here. When the system never loaded, write "No diagnostics: the system did not load".'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: The log from [turning on debug logging](https://github.com/Counterphase-Labs/ha-saj-local/blob/main/docs/en-gb/user/troubleshooting.md#turn-on-debug-logging), if you have one.
      render: text
  - type: textarea
    id: system-health
    attributes:
      label: System Health details
      description: Paste the data from the System Health card in Home Assistant (https://www.home-assistant.io/more-info/system-health#github-issues)
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: This report covers one problem. For more problems I open one issue each.
          required: true
        - label: This report is not a duplicate of an existing bug report.
          required: true
