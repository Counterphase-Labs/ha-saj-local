services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.3
    ports:
      - "8123:8123"
    environment:
      TZ: UTC
      PYTHONPYCACHEPREFIX: /tmp/saj_local_pycache
    volumes:
      - ./config:/config
      - ./custom_components/saj_local:/config/custom_components/saj_local:ro
    tmpfs:
      - /config/custom_components/saj_local/__pycache__
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  modbus-mock:
    build:
      context: ./modbus_mock
    volumes:
      - ./modbus_mock/scenarios/hs3-battery.yaml:/config/config.yaml:ro
    ports:
      - "${SAJ_MOCK_HOST_PORT:-5020}:502"
    restart: unless-stopped

  modbus-mock-h2:
    build:
      context: ./modbus_mock
    volumes:
      - ./modbus_mock/scenarios/h2-battery.yaml:/config/config.yaml:ro
    ports:
      - "${SAJ_MOCK_H2_HOST_PORT:-5021}:502"
    restart: unless-stopped
